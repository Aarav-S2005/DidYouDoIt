name: Build Windows Application & Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: |
          cd app
          ./mvnw.cmd test

      - name: Build Application JAR
        run: |
          cd app
          ./mvnw.cmd clean package -DskipTests

      - name: Package Windows Portable Bundle & Installer
        run: |
          $JarPath = "app/target/DidYouDoIt-1.0-SNAPSHOT-all.jar"
          if (-not (Test-Path $JarPath)) {
            $JarPath = (Get-ChildItem -Path "app/target" -Filter "DidYouDoIt-*.jar" | Select-Object -First 1).FullName
          }
          $JarLeaf = Split-Path $JarPath -Leaf

          $OutDir = "packaging/windows/output"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          New-Item -ItemType Directory -Force -Path "packaging/windows/staging/jars" | Out-Null
          Copy-Item $JarPath "packaging/windows/staging/jars/DidYouDoIt.jar"

          $Icon = "app/src/main/resources/icons/app-icon.ico"
          if (-not (Test-Path $Icon)) {
            $Icon = "app/src/main/resources/icons/app-icon.png"
          }

          # 1. Build portable app-image and zip
          jpackage `
            --type app-image `
            --input "packaging/windows/staging/jars" `
            --main-jar "DidYouDoIt.jar" `
            --main-class "com.aarav.didyoudoit.Main" `
            --name "DidYouDoIt" `
            --app-version "1.0.0" `
            --vendor "Aarav" `
            --icon $Icon `
            --dest $OutDir

          Compress-Archive -Path "$OutDir/DidYouDoIt/*" -DestinationPath "$OutDir/DidYouDoIt-Windows-Portable-v1.0.0.zip" -Force

          # 2. Build MSI installer
          jpackage `
            --type msi `
            --input "packaging/windows/staging/jars" `
            --main-jar "DidYouDoIt.jar" `
            --main-class "com.aarav.didyoudoit.Main" `
            --name "DidYouDoIt" `
            --app-version "1.0.0" `
            --vendor "Aarav" `
            --icon $Icon `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            --dest $OutDir

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DidYouDoIt-Windows-Packages
          path: |
            packaging/windows/output/*.zip
            packaging/windows/output/*.msi
